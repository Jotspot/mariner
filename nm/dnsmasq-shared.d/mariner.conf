# Hotspot DNS (NetworkManager shared-mode dnsmasq): make the router reachable
# by name. "@NAME@" (the hostname; install.sh fills it in) is for Android,
# which doesn't resolve mDNS names in browsers; "@NAME@.local" is answered here
# too as a fallback for mDNS.
address=/@NAME@/10.42.0.1
address=/@NAME@.local/10.42.0.1
