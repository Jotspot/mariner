# Mariner: run the official ExpressVPN daemon only inside the "evpn" network
# namespace (bin/mariner-evpn-netns), with that namespace's resolv.conf, so it
# can never change the Pi's own routing, firewall or DNS. If the namespace
# can't be created, the daemon doesn't start (rather than running on the host).
# Started/stopped by mariner-ctl via mariner-vpn-expressvpn.target.
[Unit]
Requires=mariner-evpn-netns.service
After=mariner-evpn-netns.service
PartOf=mariner-vpn-expressvpn.target

[Service]
NetworkNamespacePath=/run/netns/evpn
BindPaths=/etc/netns/evpn/resolv.conf:/etc/resolv.conf
