# Mariner: run Cloudflare's WARP daemon only inside the "warp" network
# namespace (bin/mariner-sandbox-netns), with that namespace's resolv.conf, so
# it can never change the Pi's own routing, firewall or DNS. If the namespace
# can't be created, the daemon doesn't start (rather than running on the host).
# Started/stopped by mariner-ctl via mariner-vpn-warp.target.
[Unit]
Requires=mariner-warp-netns.service
After=mariner-warp-netns.service
PartOf=mariner-vpn-warp.target

[Service]
NetworkNamespacePath=/run/netns/warp
BindPaths=/etc/netns/warp/resolv.conf:/etc/resolv.conf
